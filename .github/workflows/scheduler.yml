name: AI Affiliate & Growth Pipeline

on:
  schedule:
    - cron: "0 7 * * *"   # ~10:00 Europe/Kyiv (лето, UTC+3); полное управление расписанием позже перейдёт в TimeService
    - cron: "0 16 * * *"  # ~19:00 Europe/Kyiv (лето, UTC+3); полное управление расписанием позже перейдёт в TimeService
  workflow_dispatch:       # ручной запуск кнопкой в GitHub

concurrency:
  group: ai-affiliate-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}" >> .env
          echo "TELEGRAM_CHANNEL_USERNAME=${{ secrets.TELEGRAM_CHANNEL_USERNAME }}" >> .env
          echo "TELEGRAM_OWNER_ID=${{ secrets.TELEGRAM_OWNER_ID }}" >> .env
          echo "TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" >> .env
          echo "TWITTER_API_KEY=${{ secrets.TWITTER_API_KEY }}" >> .env
          echo "TWITTER_API_SECRET=${{ secrets.TWITTER_API_SECRET }}" >> .env
          echo "TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}" >> .env
          echo "TWITTER_ACCESS_SECRET=${{ secrets.TWITTER_ACCESS_SECRET }}" >> .env
          echo "VK_ACCESS_TOKEN=${{ secrets.VK_ACCESS_TOKEN }}" >> .env
          echo "VK_GROUP_ID=${{ secrets.VK_GROUP_ID }}" >> .env
          echo "PINTEREST_ACCESS_TOKEN=${{ secrets.PINTEREST_ACCESS_TOKEN }}" >> .env
          echo "PINTEREST_BOARD_ID=${{ secrets.PINTEREST_BOARD_ID }}" >> .env
          echo "PIPELINE_MODE=growth" >> .env

      - name: Ensure directory structure
        run: |
          mkdir -p assets/output
          mkdir -p data
          mkdir -p data/logs

      - name: Initialize data files
        run: |
          if [ ! -s data/published_posts.csv ]; then
            echo "date,time,platform,topic,format,product,ai_source,post_length,message_id,status" > data/published_posts.csv
          fi
          if [ ! -s data/topic_history.json ]; then
            echo "[]" > data/topic_history.json
          fi
          if [ ! -s data/content_queue.json ]; then
            echo "[]" > data/content_queue.json
          fi
          if [ ! -s data/analytics.csv ]; then
            echo "date,metric,value" > data/analytics.csv
          fi

      - name: Run AI pipeline
        run: python -m src.main

      - name: Show report
        run: python -m src.main report

      - name: Save logs to repository
        if: always()
        run: |
          set -euo pipefail

          # Bot identity + remote (preserved from the original step)
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/Kursha88/ai-affiliate-agents.git

          # ── 1. Integrity gate: never stage/commit/push a corrupt DB ──
          # Exit 0 also covers "DB not created this run" (fresh runner).
          if ! python scripts/check_db_integrity.py data/factory.db; then
            echo "::error title=SQLite integrity check failed::data/factory.db failed quick_check - refusing to stage, commit or push the database"
            exit 1
          fi

          # ── 2. Stage allowed persistence files individually, only if they exist ──
          # Legacy files (topic_history.json, published_posts.csv) are intentionally
          # out of scope for this step and are NOT staged.
          stage_file() {
            local f="$1"
            if [ -f "$f" ]; then
              if ! git add -- "$f"; then
                echo "::error title=Git staging failed::git add failed for $f"
                exit 1
              fi
            else
              echo "Persistence file not present this run, skipping: $f"
            fi
          }
          stage_file data/factory.db
          stage_file data/analytics.csv
          stage_file data/logs/pipeline.log

          # ── 3. Commit only if the staging area actually contains changes ──
          created_commit=0
          if ! git diff --cached --quiet; then
            git commit -m "Auto: update logs [skip ci]"
            created_commit=1
          else
            echo "No staged changes - nothing to commit."
          fi

          # Guarded abort: only fails visibly, never silently resolves a conflict.
          abort_rebase_if_active() {
            if ! git rebase --abort 2>/dev/null; then
              echo "::warning::No active rebase to abort (it had already cleaned itself up)."
            fi
          }

          sync_and_push() {
            if ! git fetch origin main; then
              echo "::error title=Git fetch failed::Could not fetch origin/main before sync."
              return 1
            fi
            if ! git rebase origin/main; then
              abort_rebase_if_active
              echo "::error title=Rebase conflict::git rebase origin/main failed. A binary data/factory.db conflict must be resolved manually - the persistence commit was NOT pushed."
              return 1
            fi
            if ! git push origin main; then
              echo "::warning::First push rejected - origin/main moved. Syncing once and retrying."
              if ! git fetch origin main; then
                echo "::error title=Git fetch failed::Could not fetch origin/main before retry sync."
                return 1
              fi
              if ! git rebase origin/main; then
                abort_rebase_if_active
                echo "::error title=Rebase conflict on retry::Could not rebase onto origin/main after push rejection. Manual resolution required - persistence NOT pushed."
                return 1
              fi
              if ! git push origin main; then
                echo "::error title=Push failed::Second push attempt rejected after rebase. Persistence NOT pushed."
                return 1
              fi
            fi
          }

          # ── 4. Sync + push (only when a local persistence commit exists) ──
          if [ "$created_commit" -eq 1 ]; then
            if ! sync_and_push; then
              exit 1
            fi
          else
            echo "No persistence commit created - skipping sync/push."
          fi

          echo "Persistence step finished successfully."