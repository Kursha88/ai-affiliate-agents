project:
  name: "AI Affiliate Agents"
  version: "2.0.0"
  language: "ru"
  niche: "Нейросети и AI — новости, инструменты, лайфхаки"
  # Режим: "growth" = набор аудитории | "affiliate" = монетизация
  mode: "growth"

content:
  # Темы для fallback (когда новости не загрузились)
  topics:
    - "Как нейросети меняют работу с текстом"
    - "AI-инструменты которые экономят часы в день"
    - "Что умеет ChatGPT о чём ты не знал"
    - "5 задач которые AI делает лучше человека"
    - "Нейросети для создания контента за минуты"
    - "Как бесплатно попробовать мощные AI-модели"
    - "AI против человека: где нейросети уже лучше"
    - "Что изменится в работе из-за AI в 2026 году"
    - "Топ AI-инструментов для фрилансеров"
    - "Как использовать AI для изучения языков"
    - "Нейросети для создания видео — обзор"
    - "AI для малого бизнеса — практический гид"
    - "Голосовые AI-ассистенты: сравнение"
    - "Как AI помогает в обучении и образовании"
    - "Нейросети для дизайна без навыков дизайнера"
    - "Автоматизация рутины с помощью AI-агентов"
    - "Что такое RAG и зачем это знать"
    - "No-code AI инструменты для автоматизации"

  # Форматы постов (чередуются чтобы не надоедало)
  formats:
    - "Новость AI"
    - "Обзор инструмента"
    - "Топ-5 инструментов"
    - "Пошаговая инструкция"
    - "Сравнение сервисов"
    - "Проблема и решение"
    - "Лайфхак дня"
    - "Новость AI"          # повторяем — новости чаще других форматов
    - "Личная рекомендация"
    - "Кейс использования"
    - "Вопрос и ответ"

# Источники новостей для NewsHunter
news_sources:
  hacker_news:
    enabled: true
    max_stories: 50
    max_age_hours: 48
  reddit:
    enabled: true
    subreddits:
      - "MachineLearning"
      - "artificial"
      - "singularity"
      - "ChatGPT"
      - "LocalLLaMA"
    posts_per_sub: 10

ai:
  primary: "gemini"
  fallback: "groq"
  model_gemini: "gemini-2.0-flash"
  model_groq: "llama-3.3-70b-versatile"
  temperature: 0.75
  max_tokens: 1200

logging:
  enabled: true
  file: "data/published_posts.csv"
  analytics_file: "data/analytics.csv"