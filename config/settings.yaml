project:
  name: "AI Growth & Viral Agents"
  version: "2.5.0"
  language: "ru"
  niche: "Секреты нейросетей, скрытые промпты, бесплатные AI-инструменты и лайфхаки"
  mode: "growth"

content:
  # Практические, вирусные темы с максимальной пользой (без скучных новостей)
  topics:
    - "Секретный промпт для ChatGPT, который заставляет его думать как Senior-специалист"
    - "5 абсолютно бесплатных нейросетей, которые заменяют платные Midjourney и ElevenLabs"
    - "Как обойти лимиты бесплатных версий ChatGPT и Claude без покупки подписок"
    - "Скрытые команды и режимы в нейросетях, о которых не пишут в официальных гайдах"
    - "Бесплатная связка нейросетей, которая создает готовые видео за 2 минуты"
    - "Как заставить ChatGPT писать живым человеческим языком без 'воды' и пафоса"
    - "ТОП-3 бесплатные нейросети для создания презентаций из любого документа"
    - "Секретный системный промпт для глубокого анализа любых данных и файлов"
    - "Как использовать локальные нейросети на слабом ПК абсолютно бесплатно"
    - "Лайфхак: как клонировать любой голос с идеальным качеством за 3 клика"
    - "Бесплатные альтернативы Cursor и Copilot для написания кода и работы"
    - "Промпт-инжиниринг: 3 приема, которые увеличивают качество ответов нейросети в 10 раз"
    - "Как за 60 секунд удалить фон, шумы и улучшить качество любого видео с помощью AI"
    - "Скрытый трюк в Perplexity для мгновенного поиска любых инсайдов и источников"

  # Форматы постов
  formats:
    - "Секретный промпт"
    - "Бесплатный аналог"
    - "Обход лимитов"
    - "Скрытая фича"
    - "Лайфхак связка"
    - "Топ бесплатных AI"
    - "Пошаговая инструкция"
    - "Разбор кейса"

ai:
  primary: "gemini"
  fallback: "groq"
  model_gemini: "gemini-1.5-flash"
  model_groq: "llama-3.3-70b-versatile"
  temperature: 0.75
  max_tokens: 1200

logging:
  enabled: true
  file: "data/published_posts.csv"
  analytics_file: "data/analytics.csv"